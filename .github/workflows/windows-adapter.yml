name: Windows and macOS Adapter
on:
  push:
    branches: ['**']
    tags: ['adapter-v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -p "test_*.py"
      - run: python scripts/check-publication-safety.py
      - run: python check_release.py
      - run: python -m PyInstaller --clean --noconfirm TokenMonitorAdapter.spec
      - name: Frozen EXE smoke test
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP 'adapter-smoke'
          $p = Start-Process .\dist\TokenMonitorAdapter.exe -ArgumentList @('--self-test','--root', $testRoot) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'EXE self-test failed' }
          $result = Get-Content (Join-Path $testRoot 'self-test-result.json') | ConvertFrom-Json
          if (-not $result.ok -or -not $result.frozen) { throw 'EXE receipt invalid' }
          (Get-FileHash .\dist\TokenMonitorAdapter.exe -Algorithm SHA256).Hash.ToLower() + '  TokenMonitorAdapter.exe' | Set-Content .\dist\SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TokenMonitorAdapter-Windows-x64
          path: |
            dist/TokenMonitorAdapter.exe
            dist/SHA256SUMS.txt
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -p "test_*.py"
      - run: python scripts/check-publication-safety.py
      - run: python check_release.py
      - name: Package source service allowlist
        run: |
          mkdir -p dist
          tar -czf dist/TokenMonitorAdapter-macOS.tar.gz adapter.py macos_service.py scripts/install-macos.sh scripts/uninstall-macos.sh README.macos.md LICENSE
          shasum -a 256 dist/TokenMonitorAdapter-macOS.tar.gz | sed 's@dist/@@' > dist/SHA256SUMS-macOS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: TokenMonitorAdapter-macOS
          path: |
            dist/TokenMonitorAdapter-macOS.tar.gz
            dist/SHA256SUMS-macOS.txt
  release:
    if: startsWith(github.ref, 'refs/tags/adapter-v')
    needs: [build, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TokenMonitorAdapter-Windows-x64
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: TokenMonitorAdapter-macOS
          path: release
      - name: Merge platform checksums
        run: cat release/SHA256SUMS-macOS.txt >> release/SHA256SUMS.txt
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft > /tmp/adapter-release.json 2>/dev/null; then
            jq -e '.isDraft == true' /tmp/adapter-release.json
            gh release upload "$GITHUB_REF_NAME" release/TokenMonitorAdapter.exe release/TokenMonitorAdapter-macOS.tar.gz release/SHA256SUMS.txt --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file RELEASE.md
          else
            gh release create "$GITHUB_REF_NAME" release/TokenMonitorAdapter.exe release/TokenMonitorAdapter-macOS.tar.gz release/SHA256SUMS.txt --draft --title "Token Monitor Adapter $GITHUB_REF_NAME" --notes-file RELEASE.md
          fi
